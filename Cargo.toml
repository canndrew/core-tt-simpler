[package]
name = "core-tt-simpler"
version = "0.1.0"
edition = "2024"

[dependencies]
ubig = { path = "/home/shum/src/rust/ubig" }
lazy_static = "*"
parser = { path = "/home/shum/work/src/simplicity-hl-again/parser" }
core-tt-simpler-macros = { path = "core-tt-simpler-macros" }
#derive-where = "*"

[profile.release-with-debug]
inherits = "release"
debug = true
debug-assertions = true

[lints.clippy]
empty_line_after_doc_comments = "allow"
