[workspace]
resolver = "3"
members = [
    "core-tt",
    "core-tt/core-tt-macros",
    "core-tt/fuzz",
    "ubig",
    #"more-tt",
    #"parser",
    #"small-bit-vec",
    #"small-bit-vec/fuzz",
    #"vast-vec",
    #"vast-vec/fuzz",
    #"debug",
    #"elaborate", "core-tt-nbe",
]

[profile.optimized-debug]
inherits = "release"
debug = true
debug-assertions = true

[workspace.lints.clippy]
empty_line_after_doc_comments = "allow"
redundant_pattern_matching = "allow"
blocks_in_conditions = "allow"
useless_format = "allow"

