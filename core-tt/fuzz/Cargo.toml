[package]
name = "core-tt-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
num = "0.4.3"

[dependencies.core-tt]
path = ".."

[[bin]]
name = "core_tt_fuzz"
path = "fuzz_targets/core_tt_fuzz.rs"
test = false
doc = false
bench = false

[lints]
workspace = true

